version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=sqlite:///./visionops.db
      - LOG_LEVEL=INFO
      - ENABLE_AI=false
    volumes:
      - .:/workspace
    working_dir: /workspace/backend
    command: bash -lc "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - '3000:3000'
